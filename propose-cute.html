<title>나와 결혼해 줄래? 💍</title>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<style>
:root{
  --sky1:#FFE9EF; --sky2:#FFD9E4; --dot:#FFC9D9;
  --ink:#6B3247; --muted:#C08BA0; --rose:#FF7BA3; --rose-deep:#F75E90;
  --cream:#FFFDF9; --gold:#F5C86E; --mint:#BFE8D9;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0; overflow:hidden; color:var(--ink);
  background:
    radial-gradient(circle at 20% 15%, rgba(255,255,255,.55), transparent 34%),
    radial-gradient(var(--dot) 2.4px, transparent 2.6px),
    linear-gradient(180deg,var(--sky1),var(--sky2));
  background-size:auto, 34px 34px, auto;
  font-family:"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  display:flex; align-items:center; justify-content:center;
  user-select:none; -webkit-user-select:none;
}
/* ── 러브레터 카드 ── */
.letter{
  position:relative; z-index:2; text-align:center;
  background:var(--cream); border-radius:36px;
  padding:44px 40px 38px; margin:20px; max-width:520px; width:calc(100% - 32px);
  box-shadow:0 20px 50px rgba(199,94,131,.22), 0 4px 12px rgba(199,94,131,.10);
}
.letter::before{ /* 안쪽 점선 테두리 = 편지지 느낌 */
  content:""; position:absolute; inset:12px; border-radius:26px;
  border:2.5px dashed #FFD3E0; pointer-events:none;
}
.letter::after{ /* 우표 */
  content:"💌"; position:absolute; top:22px; right:26px; font-size:26px;
  background:#FFF0F5; border:2px solid #FFD3E0; border-radius:8px; padding:5px 7px;
  transform:rotate(8deg);
}
.scene{font-size:56px; letter-spacing:6px; margin-bottom:2px}
.scene .bunny{display:inline-block; animation:hop 1.8s ease-in-out infinite}
.scene .ring{display:inline-block; animation:twinkle 1.8s ease-in-out infinite .4s}
@keyframes hop{0%,100%{transform:translateY(0)}30%{transform:translateY(-9px) rotate(-6deg)}60%{transform:translateY(0)}}
@keyframes twinkle{0%,100%{transform:scale(1) rotate(-6deg)}50%{transform:scale(1.14) rotate(8deg)}}
.to-name{
  display:inline-block; font-size:15px; font-weight:800; color:var(--rose-deep);
  background:#FFF0F5; border-radius:999px; padding:6px 16px; margin:12px 0 4px;
}
.to-name:empty{display:none}
h1{
  font-size:clamp(30px,7.5vw,44px); font-weight:900; letter-spacing:-1px;
  margin:10px 0 8px; line-height:1.3; text-wrap:balance;
  text-shadow:0 2px 0 #fff;
}
h1 em{
  font-style:normal; color:var(--rose-deep); position:relative; white-space:nowrap;
}
h1 em::after{ /* 형광펜 밑줄 */
  content:""; position:absolute; left:-2%; right:-2%; bottom:4px; height:.42em;
  background:linear-gradient(90deg,#FFDFE9,#FFD0DF); z-index:-1; border-radius:4px;
}
.sub{color:var(--muted); font-size:15px; margin:0 0 30px}
/* ── 버튼 ── */
.btns{display:flex; gap:16px; justify-content:center; align-items:center; min-height:84px; flex-wrap:wrap}
button{font-family:inherit; cursor:pointer; border:none; border-radius:999px; font-weight:900}
#yes{
  position:relative; overflow:hidden;
  background:linear-gradient(180deg,#FF9BB9 0%,var(--rose) 45%,var(--rose-deep) 100%);
  color:#fff; font-size:23px; padding:17px 42px;
  border:3px solid #fff;
  box-shadow:0 7px 0 #E8A5BC, 0 14px 26px rgba(247,94,144,.35);
  transition:transform .3s cubic-bezier(.2,1.8,.4,1), font-size .3s, padding .3s;
  animation:jelly 2.4s ease-in-out infinite;
}
@keyframes jelly{0%,100%{transform:scale(1,1)}30%{transform:scale(1.035,.96)}60%{transform:scale(.97,1.03)}}
#yes::after{ /* 반짝 하이라이트 */
  content:""; position:absolute; top:5px; left:14%; width:34%; height:9px;
  background:rgba(255,255,255,.65); border-radius:999px; transform:rotate(-3deg);
}
#yes:hover{animation:none; transform:scale(1.08) rotate(-2deg)}
#yes:active{animation:none; transform:scale(.95)}
#no{
  background:#fff; color:#B9A3AD; font-size:17px; padding:13px 28px;
  border:2.5px solid #F0DEE5;
  box-shadow:0 4px 0 #F0DEE5, 0 6px 14px rgba(107,50,71,.08);
  transition:left 1.1s cubic-bezier(.16,.9,.28,1), top 1.1s cubic-bezier(.16,.9,.28,1);
}
#no .face{display:inline-block; margin-right:5px}
#no.fleeing{position:fixed; z-index:5; margin:0}
#no.tiptoe{animation:tiptoe .5s ease-in-out infinite} /* 도망칠 때 종종걸음 */
@keyframes tiptoe{0%,100%{transform:rotate(-3.5deg) translateY(0)}50%{transform:rotate(3.5deg) translateY(-2.5px)}}
.puff{position:fixed; z-index:4; pointer-events:none; animation:puff .8s ease-out forwards}
@keyframes puff{0%{opacity:.9; transform:scale(.6)}100%{opacity:0; transform:scale(1.5) translateY(-8px)}}
/* ── 말풍선 멘트 ── */
.bubble{
  position:relative; display:inline-block; min-height:1.5em; margin-top:26px;
  background:#FFF0F5; color:var(--rose-deep); font-weight:800; font-size:14.5px;
  border-radius:999px; padding:9px 20px; opacity:0; transition:opacity .3s;
}
.bubble.show{opacity:1}
.bubble::before{
  content:""; position:absolute; top:-7px; left:50%; transform:translateX(-50%);
  border:8px solid transparent; border-bottom-color:#FFF0F5; border-top:0;
}
/* ── 떠다니는 하트 ── */
.heart{position:fixed; z-index:1; pointer-events:none; animation:rise linear forwards; will-change:transform,opacity}
@keyframes rise{
  0%{transform:translateY(0) rotate(0); opacity:0}
  12%{opacity:.85}
  100%{transform:translateY(-110vh) rotate(40deg); opacity:0}
}
/* ── 팝업 ── */
.overlay{
  position:fixed; inset:0; z-index:10; display:none;
  align-items:center; justify-content:center;
  background:rgba(107,50,71,.32); backdrop-filter:blur(7px);
}
.overlay.show{display:flex}
.popup{
  position:relative; background:var(--cream); border-radius:36px; padding:46px 42px 38px;
  text-align:center; max-width:400px; margin:20px;
  box-shadow:0 24px 60px rgba(107,50,71,.35);
  animation:popin .55s cubic-bezier(.2,1.7,.4,1);
}
.popup::before{
  content:""; position:absolute; inset:12px; border-radius:26px;
  border:2.5px dashed #FFD3E0; pointer-events:none;
}
@keyframes popin{0%{transform:scale(.4) rotate(-5deg); opacity:0}100%{transform:scale(1) rotate(0); opacity:1}}
.popup .big{font-size:62px; animation:beat 1s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}30%{transform:scale(1.18)}}
.popup h2{font-size:31px; font-weight:900; margin:8px 0 8px; letter-spacing:-.5px}
.popup p{color:var(--muted); font-size:15px; margin:0; line-height:1.75}
.popup .stamp{
  display:inline-block; margin-top:16px; font-size:12.5px; font-weight:800;
  color:#C99B3F; background:#FFF6E3; border-radius:999px; padding:6px 14px;
}
/* ── 결혼식 날짜 입력 폼 ── */
.date-popup{max-width:380px; text-align:left}
.date-popup .big{text-align:center}
.date-popup h2{text-align:center}
.date-popup .hint{color:var(--muted); font-size:13.5px; text-align:center; margin:0 0 24px; line-height:1.6}
.field-row{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.field{margin-bottom:14px}
.field label{display:block; font-size:12.5px; font-weight:800; color:var(--rose-deep); margin-bottom:5px}
.field input{
  width:100%; font-family:inherit; font-size:15px; color:var(--ink); font-weight:700;
  background:#FFF6FA; border:2px solid #FFD3E0; border-radius:14px; padding:10px 14px;
}
.field input:focus{outline:none; border-color:var(--rose)}
.tentative{
  display:flex; align-items:flex-start; gap:8px; font-size:13px; font-weight:700; color:var(--muted);
  line-height:1.5; cursor:pointer; margin-bottom:10px;
}
.tentative input{width:17px; height:17px; margin-top:2px; accent-color:var(--rose); flex:none}
.date-popup button[type="submit"]{
  width:100%; margin-top:8px; background:linear-gradient(180deg,#FF9BB9,var(--rose) 45%,var(--rose-deep));
  color:#fff; font-size:16px; padding:13px; border:3px solid #fff;
  box-shadow:0 5px 0 #E8A5BC, 0 10px 20px rgba(247,94,144,.3);
}
.date-popup button[type="submit"]:disabled{opacity:.6}
.date-err{color:var(--rose-deep); font-size:12.5px; font-weight:800; margin:-6px 0 10px; min-height:1em}
@media (prefers-reduced-motion: reduce){
  .scene .bunny,.scene .ring,#yes,.popup .big,#no.tiptoe{animation:none}
  .heart{display:none}
}
@media (max-width:480px){
  .letter{padding:38px 24px 32px}
  .scene{font-size:46px}
  #yes{font-size:21px; padding:15px 34px}
}
</style>

<div class="letter">
  <div class="scene"><span class="bunny">🐰</span><span class="ring">💍</span></div>
  <p class="to-name" id="to-name"></p>
  <h1>나와 <em>결혼해</em> 줄래?</h1>
  <p class="sub">신중하게 대답해 줘… 아니, 사실 답은 정해져 있어 🤭</p>
  <div class="btns">
    <button id="yes">좋아!! 💖</button>
    <button id="no"><span class="face">🙂</span>싫어!!</button>
  </div>
  <div><span class="bubble" id="bubble"></span></div>
</div>

<div class="overlay" id="date-overlay" role="dialog" aria-modal="true" aria-labelledby="date-title">
  <div class="popup date-popup">
    <div class="big" aria-hidden="true">💐</div>
    <h2 id="date-title">결혼식 날짜가 언제야?</h2>
    <p class="hint">아직 정하지 않았다면 대략적인 예상 날짜를 적어줘도 괜찮아!</p>
    <form id="date-form">
      <div class="field-row">
        <div class="field"><label for="f-groom">신랑 이름</label><input id="f-groom" required placeholder="이름"></div>
        <div class="field"><label for="f-bride">신부 이름</label><input id="f-bride" required placeholder="이름"></div>
      </div>
      <div class="field"><label for="f-date">결혼식 날짜</label><input id="f-date" type="date" required></div>
      <label class="tentative"><input type="checkbox" id="f-tentative"> 아직 날짜를 못 정했어요 (예상 날짜예요) 🙈</label>
      <p class="date-err" id="date-err"></p>
      <button type="submit" id="date-submit">다음으로! 💕</button>
    </form>
  </div>
</div>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="thanks">
  <div class="popup">
    <div class="big" aria-hidden="true">💖</div>
    <h2 id="thanks">고마워!!</h2>
    <p id="thanks-msg">세상에서 제일 행복하게 해줄게.<br>평생 잘 부탁해 🥰</p>
    <div><span class="stamp" id="stamp"></span></div>
  </div>
</div>

<script src="/api/config" onerror="console.warn('[proposal] /api/config 로드 실패 — 저장 없이 진행합니다')"></script>
<script src="proposal-shared.js"></script>
<script>
/* URL로 이름 커스텀: ?groom=신랑&bride=신부 (구버전 ?to=&from= 도 지원) */
const params = new URLSearchParams(location.search);
const to = params.get('to'), from = params.get('from');
const groom = params.get('groom'), bride = params.get('bride');
if (groom && bride) {
  document.getElementById('to-name').textContent = `신랑 ${groom} 💍 신부 ${bride}`;
  document.getElementById('thanks-msg').innerHTML =
    `${groom} ♥ ${bride}<br>세상에서 제일 행복하게 해줄게.<br>평생 잘 부탁해 🥰`;
} else {
  if (to) document.getElementById('to-name').textContent = `${to}에게 💌`;
  if (from) document.getElementById('thanks-msg').innerHTML =
    `세상에서 제일 행복하게 해줄게.<br>평생 잘 부탁해 🥰 — ${from} 올림`;
}

const yes = document.getElementById('yes');
const no = document.getElementById('no');
const face = no.querySelector('.face');
const bubble = document.getElementById('bubble');
let dodges = 0, lastFlee = 0;

const TAUNTS = [
  '어…? 슬금슬금 어디 가지? 🫢',
  '싫어 버튼이 부끄러움을 타나 봐',
  '포기하는 게 좋을걸? 😏',
  '버튼도 우리 사이를 응원하고 있어',
  '거의 잡았는데! …아깝다 🤭',
  '이쯤 되면 운명이야',
  '좋아!! 버튼은 도망 안 가~ 💕',
];
const FACES = ['😗','😯','😳','😰','🥵','😭','🫠'];

/* 현재 위치를 fixed 좌표로 고정 */
function pin() {
  if (no.classList.contains('fleeing')) return;
  const r = no.getBoundingClientRect();
  no.classList.add('fleeing');
  no.style.left = r.left + 'px';
  no.style.top = r.top + 'px';
  no.style.width = r.width + 'px';
}
/* 슬금슬금 도망: 커서 반대 방향으로 스르륵 미끄러짐 */
function flee(px, py, opts = {}) {
  const now = performance.now();
  if (now - lastFlee < (opts.urgent ? 60 : 420)) return; // 이동 중 과도한 재발동 방지
  lastFlee = now;
  dodges++;
  pin();
  const r = no.getBoundingClientRect();
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  /* 도망간 자리에 연기 */
  const p = document.createElement('span');
  p.className = 'puff'; p.textContent = '💨';
  p.style.cssText = `left:${r.left - 6}px; top:${cy - 12}px; font-size:22px`;
  document.body.appendChild(p);
  setTimeout(() => p.remove(), 850);
  /* 방향: 커서 반대쪽 + 살짝 랜덤 */
  let ang = (px === undefined) ? Math.random() * Math.PI * 2 : Math.atan2(cy - py, cx - px);
  ang += (Math.random() - .5) * .9;
  const dist = opts.urgent ? 180 + Math.random() * 90 : 130 + Math.random() * 70;
  const pad = 14;
  let nx = r.left + Math.cos(ang) * dist;
  let ny = r.top + Math.sin(ang) * dist;
  /* 벽에 몰리면 반대편으로 튕겨 나감 */
  if (nx < pad || nx > innerWidth - r.width - pad) nx = pad + Math.random() * (innerWidth - r.width - pad * 2);
  if (ny < pad || ny > innerHeight - r.height - pad) ny = pad + Math.random() * (innerHeight - r.height - pad * 2);
  /* 좋아 버튼 위에는 절대 안 앉아요 */
  const yr = yes.getBoundingClientRect();
  for (let i = 0; i < 20; i++) {
    const clear = nx + r.width < yr.left - 10 || nx > yr.right + 10 || ny + r.height < yr.top - 10 || ny > yr.bottom + 10;
    if (clear) break;
    nx = pad + Math.random() * (innerWidth - r.width - pad * 2);
    ny = pad + Math.random() * (innerHeight - r.height - pad * 2);
  }
  no.style.left = nx + 'px';
  no.style.top = ny + 'px';
  /* 종종걸음 + 표정 변화 */
  no.classList.add('tiptoe');
  clearTimeout(no._tiptoeT);
  no._tiptoeT = setTimeout(() => no.classList.remove('tiptoe'), opts.urgent ? 500 : 1100);
  face.textContent = FACES[Math.min(dodges, FACES.length - 1)];
  bubble.textContent = TAUNTS[Math.min(dodges - 1, TAUNTS.length - 1)];
  bubble.classList.add('show');
  /* 도망갈수록 좋아 버튼이 커져요 */
  const g = Math.min(dodges, 8);
  yes.style.fontSize = 23 + g * 2.2 + 'px';
  yes.style.padding = `${17 + g * 1.8}px ${42 + g * 4.5}px`;
}

/* 데스크톱: 마우스가 다가오면 슬금슬금 */
addEventListener('pointermove', e => {
  if (e.pointerType && e.pointerType !== 'mouse') return;
  const r = no.getBoundingClientRect();
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  const dist = Math.hypot(e.clientX - cx, e.clientY - cy);
  if (dist < r.width / 2 + 85) flee(e.clientX, e.clientY, { urgent: dist < r.width / 2 + 30 });
});
/* 모바일: 누르는 순간 급하게 도망 (click이 완성되기 전에 튐) */
no.addEventListener('touchstart', e => { e.preventDefault(); const t = e.touches[0]; flee(t.clientX, t.clientY, { urgent: true }); }, { passive: false });
no.addEventListener('pointerdown', e => { e.preventDefault(); flee(e.clientX, e.clientY, { urgent: true }); });
/* 키보드로도 못 눌러요 */
no.addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flee(undefined, undefined, { urgent: true }); bubble.textContent = '키보드로도 안 돼요~ ⌨️🙅'; }
});
/* 혹시라도 클릭이 통과하면 마지막 방어선 */
no.addEventListener('click', e => { e.preventDefault(); flee(e.clientX, e.clientY, { urgent: true }); });
/* 가만히 있어도 가끔 슬쩍 자리를 옮겨요 */
setInterval(() => {
  if (dodges > 0 && Math.random() < .45 && !document.getElementById('overlay').classList.contains('show'))
    flee(undefined, undefined, {});
}, 3800);

/* 좋아!! → 결혼식 날짜를 먼저 물어보는 팝업 */
const dateOverlay = document.getElementById('date-overlay');
const dateForm = document.getElementById('date-form');
const dateErr = document.getElementById('date-err');
const dateSubmit = document.getElementById('date-submit');
const fGroom = document.getElementById('f-groom'), fBride = document.getElementById('f-bride');
if (groom) fGroom.value = groom;
if (bride) fBride.value = bride;

yes.addEventListener('click', () => {
  no.style.display = 'none';
  dateOverlay.classList.add('show');
  (fGroom.value ? fBride : fGroom).focus();
});

dateForm.addEventListener('submit', async e => {
  e.preventDefault();
  const g = fGroom.value.trim(), b = fBride.value.trim(), wd = document.getElementById('f-date').value;
  const tentative = document.getElementById('f-tentative').checked;
  if (!g || !b || !wd) { dateErr.textContent = '이름이랑 날짜를 모두 적어줘야 해요!'; return; }
  dateErr.textContent = '';
  dateSubmit.disabled = true;
  dateSubmit.textContent = '저장하는 중… 💌';

  if (window.ProposalShared) {
    await window.ProposalShared.submitProposalResponse({
      groom: g, bride: b, weddingDate: wd, isTentative: tentative, pageVersion: 'cute',
    });
  }

  const wdFmt = wd.replaceAll('-', '.');
  document.getElementById('thanks-msg').innerHTML =
    `${g} ♥ ${b}<br>세상에서 제일 행복하게 해줄게.<br>평생 잘 부탁해 🥰`;
  document.getElementById('stamp').textContent =
    `${tentative ? '💭 예상' : '💍 확정'} 결혼식 날짜: ${wdFmt}`;

  dateOverlay.classList.remove('show');
  document.getElementById('overlay').classList.add('show');
  burst(44);
});

/* 하트 이펙트 */
const EMOJI = ['💖','💗','💕','🩷','🌸','✨','💘'];
function spawnHeart(x, dur, size, delay = 0) {
  const h = document.createElement('span');
  h.className = 'heart';
  h.textContent = EMOJI[Math.floor(Math.random() * EMOJI.length)];
  h.style.cssText = `left:${x}px; bottom:-40px; font-size:${size}px; animation-duration:${dur}s; animation-delay:${delay}s`;
  document.body.appendChild(h);
  setTimeout(() => h.remove(), (dur + delay) * 1000 + 200);
}
function burst(n) {
  for (let i = 0; i < n; i++)
    spawnHeart(Math.random() * innerWidth, 2.2 + Math.random() * 2, 20 + Math.random() * 26, Math.random() * .8);
}
/* 은은한 배경 하트 */
if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
  setInterval(() => spawnHeart(Math.random() * innerWidth, 8 + Math.random() * 5, 13 + Math.random() * 13), 1100);
}
</script>
